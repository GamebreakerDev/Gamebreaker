; controls.ini - controller settings for Gamebreaker.
;
; Read once when the game starts. Only the key_ lines below count with the
; controller layer off; everything else needs it on (GB_PADS=1;
; port\play.ps1 -Pads). Put a copy beside gamebreaker.exe, or
; name one with GB_PAD_CONFIG=<path>. Without one, the values below are the
; built-in defaults. Unknown names are reported in the log and skipped.
;
; [all] applies to every player; [player1] to [player4] change one player and
; only need the lines that differ. Within a section the preset is applied
; first, then single controls, whatever their order here. A preset in a
; [playerN] section resets that player's layout, including [all]'s changes.

[all]
preset            = original ; original, or turbo (third turbo on LB, Black on the left stick click)
stick_deadzone    = 0        ; percent, radial; the game already ignores the inner 25 % of each axis
trigger_threshold = 12       ; percent of the trigger's travel that counts as not pressed (12 % = 30 of 255)
rumble            = 100      ; percent of the game's own strength; 0 or off = no rumble
order             = auto     ; auto: pads become players 1 to 4 in the order they connect and keep them
                             ; slots: player n is Windows' controller slot n-1
keyboard_player   = 1        ; the player the keyboard drives, 1 to 4, or 0 for none
background_input  = 0        ; 1: controllers still count when the game window is not in front
count             = 4        ; controllers the game sees, 1 to 4, or auto (those connected at start)

; Any of the original pad's controls can take its value from any control of
; the pad in your hands. Original pad controls:
;   a b x y black white left_trigger right_trigger start back
;   left_thumb right_thumb dpad_up dpad_down dpad_left dpad_right
; Controls of a modern pad (by position, so south is A on an Xbox pad and
; cross on a PlayStation pad):
;   south east west north left_shoulder right_shoulder left_trigger
;   right_trigger start back left_stick_click right_stick_click
;   dpad_up dpad_down dpad_left dpad_right
;   lstick_up lstick_down lstick_left lstick_right (and rstick_...), or none
; Sticks: left_stick and right_stick take left, right or none.
;
; Example: player 2 plays with the turbo layout and swaps X and Y.
;
; [player2]
; preset = turbo
; x      = north
; y      = west
;
; Keyboard keys, for the player the keyboard drives. Without a line a control
; keeps its default key. The defaults: W A S D move; K A (pass), L B (shoot),
; J X (trick, steal), I Y (block, rebound); Left Shift one turbo, Space two,
; ; (semicolon) all three; U right stick click (strategy); Q White, E Black;
; Enter START; Backspace or Esc BACK; arrows the D-pad; T F G H the right
; stick. One key may press several controls: that is how the turbo keys work
; (the game counts turbos held, not which ones):
;   key_left_trigger  = lshift, space, semicolon
;   key_right_trigger = space, semicolon
;   key_left_thumb    = semicolon
; Names: A to Z, 0 to 9, F1 to F10, Numpad0 to Numpad9,
; enter, space, tab, backspace, escape, shift, lshift, rshift, ctrl, lctrl,
; rctrl, up, down, left, right, insert,
; delete, home, end, pageup, pagedown, comma, period, slash, semicolon, quote,
; minus, equals, leftbracket, rightbracket, backslash, grave, mouse1 to mouse5.
; F11 and F12 belong to the game's window (fullscreen, screenshot).
;   key_a key_b key_x key_y key_black key_white key_left_trigger key_right_trigger
;   key_start key_back key_left_thumb key_right_thumb
;   key_dpad_up key_dpad_down key_dpad_left key_dpad_right
;   key_left_stick_up key_left_stick_down key_left_stick_left key_left_stick_right
;   key_right_stick_up key_right_stick_down key_right_stick_left key_right_stick_right
;
; [player1]
; key_a     = N
; key_start = P
